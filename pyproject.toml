[project]
name = "medical-jepa-lab"
version = "0.1.0"
description = "A hands-on PyTorch lab for implementing I-JEPA and LeJEPA on medical images."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
  "matplotlib>=3.9",
  "medmnist>=3.0",
  "numpy>=1.26",
  "pillow>=10.4",
  "pyyaml>=6.0",
  "scikit-learn>=1.5",
  "torch>=2.6",
  "torchvision>=0.21",
  "tqdm>=4.66",
  "trackio>=0.35",
  "umap-learn>=0.5.7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.11",
]
profile = [
  "tensorboard>=2.18",
]

[project.scripts]
medjepa-train-ijepa = "medjepa.train_ijepa:main"
medjepa-train-lejepa = "medjepa.train_lejepa:main"
medjepa-eval = "medjepa.evaluate:main"
medjepa-inspect = "medjepa.inspect_batch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medjepa"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
